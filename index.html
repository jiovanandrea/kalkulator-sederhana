<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="calculator">
        <input id="display" readonly> 
        <div id="keys">
            <button onclick="simbol('+')" class="operator-btn">+</button>
            <button onclick="simbol('7')">7</button>
            <button onclick="simbol('8')">8</button>
            <button onclick="simbol('9')">9</button>
            <button onclick="simbol('-')" class="operator-btn">-</button>
            <button onclick="simbol('4')">4</button>
            <button onclick="simbol('5')">5</button>
            <button onclick="simbol('6')">6</button>
            <button onclick="simbol('*')" class="operator-btn">*</button>
            <button onclick="simbol('1')">1</button>
            <button onclick="simbol('2')">2</button>
            <button onclick="simbol('3')">3</button>
            <button onclick="simbol('/')" class="operator-btn">/</button>
            <button onclick="simbol('0')">0</button>
            <button onclick="simbol(',')">,</button>
            <button onclick="calculate()" class="operator-btn">=</button>
            <button onclick="clearAll()" class="operator-btn">C</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
